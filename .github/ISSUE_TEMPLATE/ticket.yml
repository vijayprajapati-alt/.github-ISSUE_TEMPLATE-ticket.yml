name: Support Ticket
description: Apna issue yahan likho
title: "[Ticket] "
labels: ["ticket", "open"]
body:
  - type: input
    id: user_name
    attributes:
      label: User Name
    validations:
      required: true
  - type: input
    id: company
    attributes:
      label: Company Name
      value: Hexatron Industries Limited
    validations:
      required: true
  - type: input
    id: department
    attributes:
      label: Department
    validations:
      required: true
  - type: input
    id: designation
    attributes:
      label: Designation
    validations:
      required: true
  - type: input
    id: mail_id
    attributes:
      label: Mail ID
      placeholder: name@company.com
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Contact Number
    validations:
      required: true
  - type: dropdown
    id: issue_type
    attributes:
      label: Issue Type
      options:
        - Computer / Excel
        - Internet / Network
        - CCTV
        - Travel Ticket
        - Other
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low
        - Medium
        - High
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Issue Description
      description: Issue detail me likho. Screenshot ho to yahin drag karke daal do.
    validations:
      required: true
